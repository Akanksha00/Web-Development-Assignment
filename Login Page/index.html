<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Login</title>
		<link rel="stylesheet" href="style.css">
	</head>

	<body>
		<div class="login-box">
			<div class="field">
				<label for="username">Enter Username:</label>
				<input type="email" id="username" placeholder="Enter email ID">
			</div>
			<div class="field">
				<label for="password">Enter Password:</label>
				<input type="password" id="password" placeholder="Password here">
			</div>
			<button class="login-btn" type="button">Login</button>
		</div>
	</body>

</html>
